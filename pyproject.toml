[project]
name = "tsmerge"
version = "0.1.0"
description = "Joint training vs. task arithmetic and continual strategies for time-series anomaly detection and forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# No importable package yet: uv only manages the environment.
package = false
# Always use a uv-managed Python, never the system one, so every machine runs the same build.
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

# PyTorch wheels built for CUDA 12.6 (PD-001).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
