[project]
name = "tsmerge"
version = "0.1.0"
description = "Joint training vs. task arithmetic and continual strategies for time-series anomaly detection and forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# tsmerge/ runs as modules (`python -m tsmerge.<module>`) and isn't installed (ED-030):
# uv only manages the environment.
package = false
# Always use a uv-managed Python, never the system one, so every machine runs the same build.
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

# PyTorch wheels built for CUDA 12.6 (ED-001).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
# Tests live in tests/. Scripts are tested as subprocesses, the way they run for real;
# the experiment code is imported as `tsmerge`, from the repository root, which is how
# `python -m tsmerge.<module>` finds it too (ED-030: the package isn't installed).
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# An explicit rule set, so a ruff upgrade can't change what is checked (ED-012):
# E/W pycodestyle errors and warnings, F pyflakes, I import order, UP modern syntax,
# B likely bugs, SIM simplifications, RUF ruff's own rules. Line length: ruff's default (88).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
